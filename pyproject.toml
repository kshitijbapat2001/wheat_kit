[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wheatkit"
dynamic = ["version"]
description = "Open, honest wheat phenomics from images: datasets with licence tracking, models evaluated on unseen regions, plot traits with uncertainty, and cited decision support."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "wheatkit contributors" }]
keywords = ["wheat", "plant phenotyping", "phenomics", "computer vision", "agriculture", "deep learning", "decision support", "MIAPPE", "BrAPI"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.10",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17"]
hf = ["wheatkit[torch]", "transformers>=4.40", "huggingface_hub>=0.23", "datasets>=2.19"]
geo = ["rasterio>=1.3", "geopandas>=0.14", "torchgeo>=0.6"]
tiling = ["sahi>=0.11"]
ultralytics = ["ultralytics>=8.3"]
demo = ["wheatkit[hf]", "gradio>=4.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = ["pytest>=8", "pytest-cov>=5", "black==24.10.0", "flake8==7.1.1", "pre-commit>=3.7"]
all = ["wheatkit[hf,geo,tiling,demo]"]

[project.scripts]
wheatkit = "wheatkit.cli:main"

[project.urls]
Homepage = "https://github.com/kshitijbapat2001/wheatkit"
Documentation = "https://kshitijbapat2001.github.io/wheatkit"
Issues = "https://github.com/kshitijbapat2001/wheatkit/issues"
Changelog = "https://github.com/kshitijbapat2001/wheatkit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/wheatkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wheatkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "slow: trains a tiny model on CPU (deselect with -m 'not slow')",
  "network: needs internet access (skipped in CI by default)",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["wheatkit"]
